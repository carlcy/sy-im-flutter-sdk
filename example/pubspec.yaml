name: sy_im_flutter_sdk_example
description: Demonstrates sy_im_flutter_sdk with OpenIMAdapter.
publish_to: "none"
version: 0.4.3+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  # Local example only. Customers write:
  #   sy_im_flutter_sdk: ^0.4.3
  # Do not integrate by unzipping sy-im-flutter-*.zip.
  sy_im_flutter_sdk:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
